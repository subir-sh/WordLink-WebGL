<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <title>WordLink</title>
  <style>
    /*
     * FullWindow WebGL template
     * - 브라우저 창(뷰포트) 전체를 게임 캔버스로 채움. 흰 여백/스크롤바 없음.
     * - 창 크기가 바뀌면 캔버스 CSS 크기가 따라가고, Unity(matchWebGLToCanvasSize 기본값 true)가
     *   매 프레임 렌더 해상도를 캔버스 크기 x devicePixelRatio 로 맞춘다.
     */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231F20;
    }

    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #231F20;
      outline: none;
      touch-action: none;          /* 모바일에서 스크롤/핀치줌 대신 게임 입력으로 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #unity-loading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, 60vw);
      pointer-events: none;
    }

    #unity-progress-bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      border-radius: 3px;
      background: #ffffff;
      transition: width 0.15s ease-out;
    }

    #unity-warning {
      position: fixed;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      max-width: calc(100% - 16px);
      font: 14px/1.4 sans-serif;
      display: none;
      z-index: 10;
    }

    #unity-warning > div {
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 4px;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8936569039879498" crossorigin="anonymous"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading">
    <div id="unity-progress-bar"><div id="unity-progress-bar-full"></div></div>
  </div>
  <div id="unity-warning"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progressFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    // Unity 가 에러/경고를 표시할 때 사용하는 배너. type: 'error' | 'warning' | 'info'
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      var div = document.createElement("div");
      div.textContent = msg;
      if (type == "error") div.style.background = "#ff4d4d";
      else {
        if (type == "warning") div.style.background = "#ffd24d";
        else div.style.background = "#ffffff";
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      warningBanner.appendChild(div);
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Web-Release.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Web-Release.data",
      frameworkUrl: buildUrl + "/Web-Release.framework.js",
      codeUrl: buildUrl + "/Web-Release.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Yeonieum",
      productName: "WordLink",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
      // 캔버스 CSS 크기에 맞춰 렌더 해상도를 자동으로 맞춤 (기본값 true, 명시).
      matchWebGLToCanvasSize: true,
      // 고해상도(HiDPI) 화면에서 렌더 부하가 크면 아래 주석을 풀어 픽셀 비율을 제한할 수 있음.
      // devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };


    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        // 콘솔/외부 스크립트에서 접근 가능하도록 노출 (예: unityInstance.SetFullscreen(1))
        window.unityInstance = unityInstance;
        canvas.focus();
      }).catch(function (message) {
        unityShowBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
